name: Keep site warm

# Pings the live demo on a schedule so the free hosting tier never idles the
# app to sleep — which removes the slow cold-start that makes the LinkedIn
# in-app browser (and impatient mobile browsers) time out.

on:
  schedule:
    - cron: "*/5 * * * *"      # every ~5 minutes (GitHub may delay under load)
  workflow_dispatch:            # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live site (with retries to fully wake it)
        run: |
          URL="https://medtechsupplies.runasp.net/"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Site is warm."
              exit 0
            fi
            sleep 25
          done
          echo "Site did not return 200 after retries (cold start may still be in progress)."
          exit 0
